[project]
name = "apiverve-fortunecookiegenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Fortune Cookie Generator creates authentic fortune cookie messages including wisdom, predictions, advice, humor, and motivational quotes."
keywords = ["fortune cookie api", "fortune cookie generator", "fortune cookie quotes api", "free fortune cookie api", "fortune cookie of the day api"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/fortunecookie?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/fortunecookie?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/fortunecookie-api"
Twitter = "https://twitter.com/apivervehq"
